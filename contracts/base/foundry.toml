# Base contracts: the splitters for creator APIs paid in USDC on Base.
# Libraries are installed once in ../lib and the small shared interfaces live in ../shared (see ../README.md).
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["../lib"]
allow_paths = ["../shared", "../lib"]
remappings = [
  "forge-std/=../lib/forge-std/src/",
  "shared/=../shared/",
]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000

[rpc_endpoints]
base = "${BASE_RPC_URL}"
